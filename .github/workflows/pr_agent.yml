name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: docker://pragent/pr-agent:0.42.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          openrouter__key: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: "gemini/gemini-3.5-flash"
          config.fallback_models: '["gemini/gemini-3.5-flash-lite", "openrouter/z-ai/glm-5.2:free"]'
          config.custom_model_max_tokens: "20000"
          config.ai_timeout: "300"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

  agent_output_guard:
    needs: pr_agent_job
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    name: Fail if PR Agent produced no review
    steps:
      - name: Check PR Agent logs for terminal LLM failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOB_NAME="Run pr agent on every pull request, respond to user comments"
          JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq ".jobs[] | select(.name == \"${JOB_NAME}\") | .id")
          if [ -z "$JOB_ID" ]; then
            echo "PR Agent job not present in this run (skipped); nothing to check."
            exit 0
          fi
          LOGS=""
          for i in 1 2 3; do
            LOGS=$(gh api "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" 2>/dev/null) && [ -n "$LOGS" ] && break
            sleep 5
          done
          if printf '%s' "$LOGS" | grep -q "Failed to generate prediction with any model"; then
            echo "::error::PR Agent exhausted all configured models without producing output."
            exit 1
          fi
          echo "No terminal LLM failure found in PR Agent logs."
